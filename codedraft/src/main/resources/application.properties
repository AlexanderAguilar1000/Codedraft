spring.application.name=codedraft
app.data.profile-file=data/profile.json
app.data.courses-file=data/courses.json
app.data.catalog-file=data/catalog.json
app.data.study-sessions-file=data/study_sessions.json
server.error.include-stacktrace=never

# Servicio de IA (Flask). Si no responde a tiempo, la sesion de estudio se guarda igual sin feedback del mentor.
app.ai-service.base-url=http://localhost:5000
app.ai-service.connect-timeout-ms=2000
app.ai-service.read-timeout-ms=8000
